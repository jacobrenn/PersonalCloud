# Nginx reverse proxy for the PersonalCloud stack.
# {HOST} is a placeholder for your domain (e.g. example.com). Point DNS for
# git.{HOST}, s3.{HOST}, console.{HOST}, search.{HOST}, and litellm.{HOST}
# at this host, then terminate TLS here (certbot, or mount certs and add
# listen 443 ssl blocks).

server {
    listen 80;
    server_name git.personalcloud.home;

    # Allow large git pushes over HTTP(S)
    client_max_body_size 512m;

    location / {
        proxy_pass http://gitea:3000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket / upgrade support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Long-running git operations
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # # Required for docker login / push / pull functionality.
    # location /v2 {
    #     proxy_pass http://gitea:3000/v2;
    #     proxy_http_version 1.1;

    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    # }

}

server {
    listen 80;
    server_name s3.personalcloud.home;

    # S3 objects can be large; raise or set to 0 for no limit
    client_max_body_size 1024m;

    # S3 clients do their own retries; don't let nginx buffer or time out early
    proxy_request_buffering off;
    proxy_buffering off;

    location / {
        proxy_pass http://rustfs:9000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Required for SigV4 streaming uploads
        proxy_set_header X-Amz-Content-Sha256 $http_x_amz_content_sha256;
        proxy_set_header Connection "";

        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}

server {
    listen 80;
    server_name console.personalcloud.home;

    # The rustfs console SPA is served under /rustfs/console/, not at the root.
    # Redirect bare browser GET/HEAD requests, but do NOT redirect POST / because
    # the console login submits there. Redirecting that turns valid credentials
    # into a useless 403. Computers: very literal, very annoying.
    location = / {
        if ($request_method = GET) {
            return 302 /rustfs/console/;
        }
        if ($request_method = HEAD) {
            return 302 /rustfs/console/;
        }

        proxy_pass http://rustfs:9001;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location / {
        proxy_pass http://rustfs:9001;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # The console uses WebSockets for live updates
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}

server {
    listen 80;
    server_name search.personalcloud.home;

    location / {
        proxy_pass http://searxng:8080;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}

server {
    listen 80;
    server_name litellm.personalcloud.home;

    # Model outputs and file uploads can be chunky
    client_max_body_size 100m;

    location / {
        proxy_pass http://litellm:4000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket / upgrade support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # LLM responses stream for a long time; disable buffering so SSE
        # streams flush immediately, and give generous timeouts
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}
