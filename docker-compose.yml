services:

  # GITEA SERVICES
  gitea:
    image: docker.gitea.com/gitea:latest
    restart: unless-stopped
    environment:
      - USER_UID=1000
      - USER_GID=1000
      - GITEA__database__DB_TYPE=postgres
      - GITEA__database__HOST=gitea_db:5432
      - GITEA__database__NAME=${GITEA_DB_NAME}
      - GITEA__database__USER=${GITEA_DB_USER}
      - GITEA__database__PASSWD=${GITEA_DB_PASSWORD}
    networks:
      - gitea
      - proxy
    volumes:
      - gitea:/data
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    depends_on:
      - gitea_db

  gitea_db:
    image: docker.io/library/postgres:17
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${GITEA_DB_USER}
      - POSTGRES_PASSWORD=${GITEA_DB_PASSWORD}
      - POSTGRES_DB=${GITEA_DB_NAME}
    networks:
      - gitea
    volumes:
      - gitea_db:/var/lib/postgresql/18/data

  # RUSTFS SERVICES
  rustfs:
    image: rustfs/rustfs:latest
    restart: unless-stopped
    environment:
      - RUSTFS_VOLUMES=/data/rustfs
      - RUSTFS_ADDRESS=0.0.0.0:9000
      - RUSTFS_CONSOLE_ADDRESS=0.0.0.0:9001
      - RUSTFS_CONSOLE_ENABLE=true
      - RUSTFS_ACCESS_KEY=${RUSTFS_ACCESS_KEY}
      - RUSTFS_SECRET_KEY=${RUSTFS_SECRET_KEY}
      - RUSTFS_OBS_LOGGER_LEVEL=info
    networks:
      - rustfs
      - proxy
    volumes:
      - rustfs_data:/data/rustfs
    depends_on:
      rustfs-init:
        condition: service_completed_successfully

  rustfs-init:
    image: alpine:latest
    user: "0:0"
    networks:
      - rustfs
    volumes:
      - rustfs_data:/data
    command: chown -R 10001:10001 /data

  # SEARXNG SERVICES
  searxng:
    image: docker.io/searxng/searxng:latest
    restart: unless-stopped
    networks:
      - proxy
    volumes:
      - ./searxng:/etc/searxng:rw
      - searxng_data:/var/cache/searxng/

  # LITELLM SERVICES
  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    restart: unless-stopped
    environment:
      - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY}
      - DATABASE_URL=postgres://${LITELLM_DB_USER}:${LITELLM_DB_PASSWORD}@litellm_db:5432/${LITELLM_DB_NAME}
    command: ["--config", "/app/config.yaml", "--port", "4000", "--host", "0.0.0.0"]
    volumes:
      - ./litellm/config.yaml:/app/config.yaml:ro
    networks:
      - litellm
      - proxy
    depends_on:
      litellm_db:
        condition: service_healthy

  litellm_db:
    image: docker.io/library/postgres:17
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${LITELLM_DB_USER}
      - POSTGRES_PASSWORD=${LITELLM_DB_PASSWORD}
      - POSTGRES_DB=${LITELLM_DB_NAME}
    volumes:
      - litellm_db:/var/lib/postgresql/data
    networks:
      - litellm
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U litellm -d litellm"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ASSISTANT SERVICES
  assistant:
    build: ./assistant
    restart: unless-stopped
    environment:
      - PYAGENT_MAX_ITERATIONS=-1
      - PYAGENT_MAX_PREVIOUS_TOOL_RESULT_CHARS=-1
      - PYAGENT_BUILTIN_TOOLS_ENABLED=false
      - LITELLM_API_KEY=${LITELLM_MASTER_KEY}
    networks:
      - proxy

  # NGINX REVERSE PROXY
  nginx:
    image: docker.io/library/nginx:latest
    restart: unless-stopped
    ports:
      - "80:80"
      # - "443:443"  # uncomment when you add TLS certificates
    volumes:
      - ./nginx/proxy_params.conf:/etc/nginx/conf.d/00-proxy-params.conf:ro
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - proxy
    depends_on:
      gitea:
        condition: service_started
      rustfs:
        condition: service_started
      searxng:
        condition: service_started
      litellm:
        condition: service_started
      assistant:
        condition: service_started

networks:
  gitea:
  rustfs:
  litellm:
  proxy:
  
volumes:
  gitea:
  gitea_db:
  rustfs_data:
  searxng_data:
  litellm_db:
