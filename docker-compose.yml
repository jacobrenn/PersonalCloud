services:

  # GITEA SERVICES
  gitea:
    image: docker.gitea.com/gitea:latest
    restart: unless-stopped
    environment:
      - USER_UID=1000
      - USER_GID=1000
      - GITEA__packages__ENABLED=true
      - GITEA__packages__STORAGE_TYPE=local
      - GITEA__database__DB_TYPE=postgres
      - GITEA__database__HOST=gitea_db:5432
      - GITEA__database__NAME=${GITEA_DB_NAME}
      - GITEA__database__USER=${GITEA_DB_USER}
      - GITEA__database__PASSWD=${GITEA_DB_PASSWORD}
    ports:
      - "3000:3000"
    networks:
      - gitea
    volumes:
      - gitea:/data
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    depends_on:
      - gitea_db

  gitea_db:
    image: docker.io/library/postgres:17
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${GITEA_DB_USER}
      - POSTGRES_PASSWORD=${GITEA_DB_PASSWORD}
      - POSTGRES_DB=${GITEA_DB_NAME}
    networks:
      - gitea
    volumes:
      - gitea_db:/var/lib/postgresql/18/data

  # RUSTFS SERVICES
  rustfs:
    image: rustfs/rustfs:latest
    restart: unless-stopped
    environment:
      - RUSTFS_VOLUMES=/data/rustfs
      - RUSTFS_ADDRESS=0.0.0.0:9000
      - RUSTFS_CONSOLE_ADDRESS=0.0.0.0:9001
      - RUSTFS_CONSOLE_ENABLE=true
      - RUSTFS_ACCESS_KEY=${RUSTFS_ACCESS_KEY}
      - RUSTFS_SECRET_KEY=${RUSTFS_SECRET_KEY}
      - RUSTFS_OBS_LOGGER_LEVEL=info
    ports:
      - "9000:9000"
      - "9001:9001"
    networks:
      - rustfs
    volumes:
      - rustfs_data:/data/rustfs
    depends_on:
      rustfs-init:
        condition: service_completed_successfully

  rustfs-init:
    image: alpine:latest
    user: "0:0"
    networks:
      - rustfs
    volumes:
      - rustfs_data:/data
    command: chown -R 10001:10001 /data

  # SEARXNG SERVICES
  searxng:
    image: docker.io/searxng/searxng:latest
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./searxng:/etc/searxng:rw
      - searxng_data:/var/cache/searxng/

  # LITELLM SERVICES
  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    restart: unless-stopped
    environment:
      - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY}
      - DATABASE_URL=postgres://${LITELLM_DB_USER}:${LITELLM_DB_PASSWORD}@litellm_db:5432/${LITELLM_DB_NAME}
    ports:
      - "4000:4000"
    command: ["--config", "/app/config.yaml", "--port", "4000", "--host", "0.0.0.0"]
    volumes:
      - ./litellm/config.yaml:/app/config.yaml:ro
    networks:
      - litellm
    depends_on:
      litellm_db:
        condition: service_healthy

  litellm_db:
    image: docker.io/library/postgres:17
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${LITELLM_DB_USER}
      - POSTGRES_PASSWORD=${LITELLM_DB_PASSWORD}
      - POSTGRES_DB=${LITELLM_DB_NAME}
    volumes:
      - litellm_db:/var/lib/postgresql/data
    networks:
      - litellm
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U litellm -d litellm"]
      interval: 5s
      timeout: 5s
      retries: 5

  devpi:
    image: jonasal/devpi-server:latest
    restart: unless-stopped
    ports:
      - "3141:3141"
    environment:
      # Sets the initial password for the 'root' administrative user
      - DEVPI_PASSWORD=${DEVPI_PASSWORD}
    volumes:
      # Ensures your packages and indexes persist when the container restarts
             - devpi_data:/devpi/server

networks:
  gitea:
  rustfs:
  litellm:
  
volumes:
  gitea:
  gitea_db:
  rustfs_data:
  searxng_data:
  litellm_db:
  devpi_data:
